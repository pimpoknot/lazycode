# LazyCode window. Personal overrides go in ~/.config/lazycode.local/kitty.conf

font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13
window_padding_width 6
hide_window_decorations no
confirm_os_window_close 0
enable_audio_bell no
repaint_delay 8
input_delay 1
sync_to_monitor yes
shell_integration disabled
update_check_interval 0

# Tokyo Night
foreground #c0caf5
background #1a1b26
selection_foreground #c0caf5
selection_background #33467c
cursor #c0caf5
cursor_text_color #1a1b26
color0  #15161e
color8  #414868
color1  #f7768e
color9  #f7768e
color2  #9ece6a
color10 #9ece6a
color3  #e0af68
color11 #e0af68
color4  #7aa2f7
color12 #7aa2f7
color5  #bb9af7
color13 #bb9af7
color6  #7dcfff
color14 #7dcfff
color7  #a9b1d6
color15 #c0caf5

# macOS: Option works as Alt, and closing the window quits the app.
macos_option_as_alt yes
macos_quit_when_last_window_closed yes

include ~/.config/lazycode.local/kitty.conf

# Every shortcut and click belongs to the editor. Keep this last.
clear_all_shortcuts yes
clear_all_mouse_actions yes
